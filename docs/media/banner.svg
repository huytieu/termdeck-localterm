<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Menlo, SFMono-Regular, Consolas, monospace">
  <style>
    .bg { fill: #161616; }
    .panel { fill: #1e1e1e; stroke: #3d3d3d; stroke-width: 2; }
    .bar { fill: #282828; }
    .mut { fill: #9b9b9b; }
    .fg { fill: #dadada; }
    .coral { fill: #e13f5e; }
    .green { fill: #4ec9a0; }
    .amber { fill: #e5b567; }

    .type span { opacity: 0; }
    .t { opacity: 0; animation: reveal .01s linear forwards; }
    @keyframes reveal { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }

    .dot-run { animation: pulse 1.6s ease-in-out infinite; }
    .dot-you { animation: pulse 0.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .feat { opacity: 0; animation: rise 0.6s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: .05; } 94% { opacity: .05; } 100% { transform: translateY(330px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .t, .feat { animation: none; opacity: 1; }
      .cursor, .dot-run, .dot-you, .scan { animation: none; }
    }
  </style>

  <rect class="bg" width="1200" height="480"/>
  <rect class="panel" x="50" y="40" width="1100" height="400" rx="14"/>
  <path class="bar" d="M50 54 a14 14 0 0 1 14 -14 h1072 a14 14 0 0 1 14 14 v28 h-1100 z"/>
  <line x1="50" y1="83" x2="1150" y2="83" stroke="#3d3d3d" stroke-width="2"/>
  <circle cx="78" cy="61" r="7" fill="#ff5f57"/>
  <circle cx="102" cy="61" r="7" fill="#febc2e"/>
  <circle cx="126" cy="61" r="7" fill="#28c840"/>
  <text x="600" y="66" text-anchor="middle" font-size="15" class="mut">termdeck — the deck your agents work on</text>

  <rect class="scan" x="52" y="90" width="1096" height="26" fill="#ffffff" opacity="0"/>

  <!-- typed prompt -->
  <text x="92" y="132" font-size="20">
    <tspan class="green">$</tspan>
    <tspan class="fg"><tspan class="t" style="animation-delay:.15s">t</tspan><tspan class="t" style="animation-delay:.25s">e</tspan><tspan class="t" style="animation-delay:.35s">r</tspan><tspan class="t" style="animation-delay:.45s">m</tspan><tspan class="t" style="animation-delay:.55s">d</tspan><tspan class="t" style="animation-delay:.65s">e</tspan><tspan class="t" style="animation-delay:.75s">c</tspan><tspan class="t" style="animation-delay:.85s">k</tspan><tspan class="t" style="animation-delay:1.0s"> </tspan><tspan class="t" style="animation-delay:1.1s">s</tspan><tspan class="t" style="animation-delay:1.2s">t</tspan><tspan class="t" style="animation-delay:1.3s">a</tspan><tspan class="t" style="animation-delay:1.4s">r</tspan><tspan class="t" style="animation-delay:1.5s">t</tspan></tspan>
  </text>

  <!-- wordmark -->
  <text x="88" y="230" font-size="84" font-weight="bold">
    <tspan fill="#ffffff">Term</tspan><tspan class="coral">Deck</tspan>
  </text>
  <rect class="cursor coral" x="500" y="164" width="34" height="72"/>

  <!-- agent status -->
  <g font-size="20">
    <circle class="dot-run green" cx="100" cy="285" r="6"/>
    <text x="120" y="292" class="fg">agent 1  coding      <tspan class="coral">src/search.ts:42</tspan></text>
    <circle class="dot-you amber" cx="100" cy="322" r="6"/>
    <text x="120" y="329" class="fg">agent 2  needs you   "ship the fix?"</text>
    <circle class="dot-run green" cx="100" cy="359" r="6" style="animation-delay:.5s"/>
    <text x="120" y="366" class="fg">agent 3  docs        report.md</text>
    <circle cx="100" cy="396" r="6" fill="none" stroke="#9b9b9b" stroke-width="2"/>
    <text x="120" y="403" class="mut">agent 4  idle        done · 2m ago</text>
  </g>

  <!-- features -->
  <g font-size="17" text-anchor="end">
    <text x="1108" y="292" class="mut feat" style="animation-delay:1.8s">click any path -&gt; rendered</text>
    <text x="1108" y="326" class="mut feat" style="animation-delay:2.1s">tweak UI -&gt; send to agent</text>
    <text x="1108" y="360" class="mut feat" style="animation-delay:2.4s">wiki · grid · canvas</text>
    <text x="1108" y="394" class="mut feat" style="animation-delay:2.7s">self-hosted · MIT</text>
  </g>

  <text x="1108" y="425" font-size="17" text-anchor="end" class="coral">termdeck.huytieu.com<tspan class="cursor">▍</tspan></text>
</svg>
